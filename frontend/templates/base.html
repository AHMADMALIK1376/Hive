<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive - Where Buzz Happens</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'feed' %}" class="nav-logo">
                <img src="{% static 'images/logo.svg' %}" alt="Hive Logo" class="logo-icon">
                <span class="logo-text">Hive</span>
            </a>
            <div class="nav-search">
                <form action="{% url 'search' %}" method="GET">
                    <input type="text" name="q" placeholder="Search Hive..." class="search-input">
                </form>
            </div>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'feed' %}" class="nav-link">Feed</a>
                    <a href="{% url 'profile' user.username %}" class="nav-link">Profile</a>
                    <a href="{% url 'logout' %}" class="nav-link nav-logout">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-link">Login</a>
                    <a href="{% url 'register' %}" class="nav-link nav-signup">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Messages -->
    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
        <div class="message message-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Hive — Where Buzz Happens 🐝</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
