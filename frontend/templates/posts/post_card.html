<div class="post-card">
    <div class="post-header">
        <img src="{{ post.user.profile.avatar.url }}" alt="Avatar" class="post-avatar">
        <div class="post-user-info">
            <a href="{% url 'profile' post.user.username %}" class="post-username">{{ post.user.username }}</a>
            <span class="post-time">{{ post.created_at|timesince }} ago</span>
        </div>
    </div>
    <div class="post-body">
        <p>{{ post.content }}</p>
        {% if post.image %}
        <img src="{{ post.image.url }}" alt="Post image" class="post-image">
        {% endif %}
    </div>
    <div class="post-actions">
        <button class="btn-like">❤️ <span>{{ post.likes.count }}</span></button>
        <button class="btn-comment">💬 <span>{{ post.comments.count }}</span></button>
    </div>
</div>
